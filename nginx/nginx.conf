# Automatically determine the optimal number of worker processes
# based on available CPU cores
worker_processes auto;

events {

    # Maximum number of simultaneous connections per worker process
    worker_connections 1024;

}

http {

    # Include MIME type mappings for serving different file types
    include /etc/nginx/mime.types;

    # Default content type if MIME type cannot be determined
    default_type application/octet-stream;

    # Enable efficient file transfer using sendfile()
    sendfile on;

    # Keep client connections alive for 65 seconds
    # to improve performance for multiple requests
    keepalive_timeout 65;

    # Define a shared memory zone for rate limiting.
    # Limits each client IP to 10 requests per second.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Define an upstream load balancing group for the application
    # containing the three application replicas
    upstream app_backend {

        # If a replica fails 3 times within 30 seconds,
        # NGINX temporarily stops sending traffic to it
        server app1:5678 max_fails=3 fail_timeout=30s;

        server app2:5678 max_fails=3 fail_timeout=30s;

        server app3:5678 max_fails=3 fail_timeout=30s;

    }

    # Include additional server configuration files
    # such as app.conf and grafana.conf
    include /etc/nginx/conf.d/*.conf;

}