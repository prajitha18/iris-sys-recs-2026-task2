version: "3.9"

services:

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - app1
      - app2
      - app3
      - grafana
    networks:
      - public
      - application
      - monitoring

  app1:
    image: hashicorp/http-echo
    command: ["-text=app1", "-listen=:5678"]
    volumes:
      - shared-data:/data
    networks:
      - application
      - storage

  app2:
    image: hashicorp/http-echo
    command: ["-text=app2", "-listen=:5678"]
    volumes:
      - shared-data:/data
    networks:
      - application
      - storage

  app3:
    image: hashicorp/http-echo
    command: ["-text=app3", "-listen=:5678"]
    volumes:
      - shared-data:/data
    networks:
      - application
      - storage

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rails_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - application

  nfs-server:
    image: itsthenetwork/nfs-server-alpine
    privileged: true
    environment:
      SHARED_DIRECTORY: /exports
    volumes:
      - shared-data:/exports
    networks:
      - storage

  backup:
    image: alpine
    command: sh -c "while true; do tar czf /backup/backup-$(date +%s).tar.gz /data; sleep 3600; done"
    volumes:
      - shared-data:/data
      - ./backup:/backup
    networks:
      - storage

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring
      - application

  grafana:
    image: grafana/grafana
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring

volumes:
  shared-data:
  mysql-data:
  grafana-data:

networks:
  public:
  application:
  storage:
  monitoring: